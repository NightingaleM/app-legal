<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>App Legal &amp; Support</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171b2e; --ink:#e7e9f3; --muted:#9aa0bd;
    --accent:#6ea8ff; --line:#2a304d;
  }
  *{box-sizing:border-box}
  html{ -webkit-text-size-adjust:100%; }
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:48px 16px;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
  }
  .wrap{ max-width:520px; margin:0 auto; text-align:center; }
  .app{ color:var(--accent); font-weight:700; font-size:1.05rem; margin-bottom:10px; }
  h1{ font-size:1.6rem; margin:0 0 8px; color:#fff; }
  .sub{ color:var(--muted); margin:0 0 30px; }
  .links{ display:flex; flex-direction:column; gap:12px; }
  .links a{
    display:block; background:var(--panel); border:1px solid var(--line);
    color:var(--ink); text-decoration:none; border-radius:10px;
    padding:16px 20px; font-size:1.05rem;
  }
  .links a span{ color:var(--muted); font-size:.9rem; margin-left:8px; }
  footer{ margin-top:34px; color:var(--muted); font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="app">NightingaleM · Apps</div>
  <h1>Legal &amp; Support</h1>
  <p class="sub">法律文档与支持页面 / Legal &amp; support pages</p>
  <div class="links">
    <a href="privacy.html">Crazy Brick Ball — Privacy Policy <span>疯狂砖球 · 隐私政策</span></a>
    <a href="support.html">Crazy Brick Ball — Support / FAQ <span>疯狂砖球 · 支持与常见问题</span></a>
    <a href="winnow/privacy.html">Winnow: Swipe to Keep — Privacy Policy <span>照片清理 · 隐私政策</span></a>
    <a href="winnow/support.html">Winnow: Swipe to Keep — Support / FAQ <span>照片清理 · 支持与常见问题</span></a>
  </div>
  <footer>NightingaleM (2026)</footer>
</div>
</body>
</html>
